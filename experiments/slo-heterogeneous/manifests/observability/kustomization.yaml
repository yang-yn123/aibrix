apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - aibrix-monitors.yaml
  - dcgm-exporter.yaml

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: aibrix-controller-manager-metrics-monitor
    patch: |-
      - op: add
        path: /metadata/labels/release
        value: prometheus
